name: CI
# Runs for pull requests and for main / release tags only: a push to a work branch
# costs no CI minutes, and a push to a branch with an open PR runs once, not twice.
# A change to docs only builds nothing: Doxygen reads only the sources, so docs cannot
# break a job. Tag pushes ignore path filters, so every release is still built.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

# A new push to a pull request stops that PR's run still in progress; main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # The fetched dependency sources (JUCE, Catch2, json, r8brain) come from the cache, so
      # configure skips the clones. A changed GIT_TAG still clones that dependency afresh.
      - uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          # The generator is part of the key: a cached sub-build only works with the one that made it.
          key: deps-${{ github.job }}-${{ runner.os }}-${{ runner.os == 'Windows' && 'ninja' || 'make' }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ github.job }}-${{ runner.os }}-${{ runner.os == 'Windows' && 'ninja' || 'make' }}-
      # On Windows, Ninja runs MSVC instead of the Visual Studio generator: only Ninja lets a
      # compiler cache sit in front of cl.exe. The developer environment puts cl on PATH.
      - &msvc-env
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - &ninja
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja Multi-Config" >> "$GITHUB_ENV"
      # Compiled objects come from ccache (Linux) or sccache (Windows). Both key on the
      # preprocessed source and the flags, so a changed file or header is always rebuilt.
      # Release tags build from scratch.
      - &compiler-cache
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          key: ${{ github.job }}-${{ runner.os }}
          # Only main saves, so pull requests cannot crowd the main caches out of the 10 GB
          # repository limit; they restore from main. The app job builds Debug and Release.
          save: ${{ github.ref == 'refs/heads/main' }}
          evict-old-files: job
          max-size: ${{ github.job == 'app' && '1G' || '500M' }}
      - &compiler-launcher
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: bash
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=$LAUNCHER" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=$LAUNCHER" >> "$GITHUB_ENV"
        env:
          LAUNCHER: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build -C Debug --output-on-failure

  io:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # The fetched dependency sources (JUCE, Catch2, json, r8brain) come from the cache, so
      # configure skips the clones. A changed GIT_TAG still clones that dependency afresh.
      - uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          # The generator is part of the key: a cached sub-build only works with the one that made it.
          key: deps-${{ github.job }}-${{ runner.os }}-${{ runner.os == 'Windows' && 'ninja' || 'make' }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ github.job }}-${{ runner.os }}-${{ runner.os == 'Windows' && 'ninja' || 'make' }}-
      - *msvc-env
      - *ninja
      - *compiler-cache
      - *compiler-launcher
      # juce_audio_devices needs ALSA; JUCE's juceaide helper (built at
      # configure time) always compiles juce_graphics, which needs FreeType and
      # fontconfig. juce_core's rt/dl/pthread come with libc; no X11/curl needed.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBIGTOP_BUILD_IO=ON -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build -C Debug --output-on-failure

  tsan:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v6
      # The fetched dependency sources (JUCE, Catch2, json, r8brain) come from the cache, so
      # configure skips the clones. A changed GIT_TAG still clones that dependency afresh.
      - uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          # The generator is part of the key: a cached sub-build only works with the one that made it.
          key: deps-${{ github.job }}-${{ runner.os }}-${{ runner.os == 'Windows' && 'ninja' || 'make' }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ github.job }}-${{ runner.os }}-${{ runner.os == 'Windows' && 'ninja' || 'make' }}-
      - *compiler-cache
      - *compiler-launcher
      # The runner's high mmap randomisation makes TSan abort at startup
      # ("unexpected memory mapping"); 28 bits is what TSan supports.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBIGTOP_TSAN=ON -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
      - run: cmake --build build --target bigtop_core_tests
      # Any race report makes the run exit non-zero, failing the job.
      - run: ./build/core/bigtop_core_tests

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # The fetched dependency sources (JUCE, Catch2, json, r8brain) come from the cache, so
      # configure skips the clones. A changed GIT_TAG still clones that dependency afresh.
      - uses: actions/cache@v4
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          # The generator is part of the key: a cached sub-build only works with the one that made it.
          key: deps-${{ github.job }}-${{ runner.os }}-${{ runner.os == 'Windows' && 'ninja' || 'make' }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-${{ github.job }}-${{ runner.os }}-${{ runner.os == 'Windows' && 'ninja' || 'make' }}-
      - *msvc-env
      - *ninja
      - *compiler-cache
      - *compiler-launcher
      - run: cmake -B build -DBIGTOP_BUILD_APP=ON -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
      - run: cmake --build build --config Debug
      # The windowless GUI tests (app/tests); no window, audio device or packet. A CRT assert ends the exe with code 3, never a dialog.
      - run: ctest --test-dir build -C Debug -R "^app:" --output-on-failure
      # The shipped exe is Release; its warnings and optimiser-only errors show only here.
      - run: cmake --build build --config Release --target bigtop_app
      # The docs screenshots must still render (exit code only; the PNGs are not compared). No audio device is used.
      - name: Render the docs screenshots
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build/app/bigtop_app_artefacts/Release/Bigtop Player.exe" -ArgumentList "--docs-screenshots", "$env:RUNNER_TEMP/docs-images" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "docs screenshots failed with exit code $($p.ExitCode)" }
      # The runtime is linked statically (top-level CMakeLists.txt); fail if a VC runtime DLL sneaks back in.
      - name: Check the exe needs no VC runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -like '*Hostx64*x64*' | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents "build/app/bigtop_app_artefacts/Release/Bigtop Player.exe"
          $deps
          if ($deps -match '(?i)vcruntime|msvcp') { throw 'exe depends on the VC runtime DLLs' }
      # Only main and release tags publish a download; other branches stop after the build.
      # The zip holds the exe only (no .pdb or import libs).
      - name: Collect the Windows app
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item "build/app/bigtop_app_artefacts/Release/Bigtop Player.exe" dist -ErrorAction Stop
          "SHORT_SHA=$($env:GITHUB_SHA.Substring(0, 7))" >> $env:GITHUB_ENV
      # upload-artifact serves the folder as one zip download.
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: BigtopPlayer-windows-${{ env.SHORT_SHA }}
          path: dist
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y doxygen
      # WARN_AS_ERROR = FAIL_ON_WARNINGS makes any Doxygen warning fail the job.
      - run: doxygen Doxyfile

  # A v* tag in the public repository becomes a GitHub Release with the Windows zip.
  # Private copies of this workflow skip it, so a tag there publishes nothing.
  # It waits for every test job, so a red test blocks the release.
  release:
    needs: [core, io, tsan, app, docs]
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BigtopPlayer-windows-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="BigtopPlayer-windows-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -q "../$zip" "Bigtop Player.exe")
          gh release create "$GITHUB_REF_NAME" "$zip" --repo "$GITHUB_REPOSITORY" --generate-notes
